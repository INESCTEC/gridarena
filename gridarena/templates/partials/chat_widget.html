<div id="chat-widget" class="chat-widget chat-widget--collapsed">
  <button id="chat-toggle" class="chat-toggle" type="button" title="Open Chat Assistant">
    <span class="chat-toggle__icon">&#128172;</span>
  </button>
  <div class="chat-panel">
    <div class="chat-panel__header">
      <span>Grid Assistant</span>
      <button id="chat-close" class="chat-panel__close" type="button">&times;</button>
    </div>
    <div id="chat-messages" class="chat-panel__messages"></div>
    <form id="chat-form" class="chat-panel__input">
      <input type="text" id="chat-input" placeholder="Ask about grids, power flow..." autocomplete="off">
      <button id="chat-send" class="btn btn-primary" type="submit">Send</button>
    </form>
  </div>
</div>
