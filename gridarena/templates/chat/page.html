{% extends "base.html" %}

{% block content %}
<div class="chat-fullpage">
  <div class="chat-fullpage__header">
    <h2>Grid Assistant</h2>
    <p class="muted">Ask questions about grids, run power flow, manage benchmarks, and more.</p>
  </div>
  <div id="chat-messages" class="chat-fullpage__messages"></div>
  <form id="chat-form" class="chat-fullpage__input">
    <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off">
    <button id="chat-send" class="btn btn-primary" type="submit">Send</button>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>window.CHAT_MODE = 'fullpage';</script>
<script src="/static/js/chat.js"></script>
{% endblock %}
